name: sql-vm-ha
metadata:
  template: sql-vm-ha@0.0.1
infra:
  provider: bicep
  path: infra
hooks:
  preprovision:
    shell: pwsh
    run: ./hooks/preprovision.ps1
    interactive: false
    continueOnError: false
  postprovision:
    shell: pwsh
    run: ./hooks/postprovision.ps1
    interactive: true
    continueOnError: false
