[project]
name = "sql-controlplane-backend"
version = "0.2.0"
description = "FastAPI backend for the SQL control plane: SQL management, chat and UI APIs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "sqlha-core[agent,mcp]",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
sqlha-core = { path = "../core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
